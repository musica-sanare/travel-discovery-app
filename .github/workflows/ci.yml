# Lint, type-check, unit and Workers-runtime tests, and production build
# (with bundle checks) from a clean checkout. E2E tests are not run here yet:
# they need a browser download, which requires the owner's approval
# (docs/DECISIONS.md ADR-025, ADR-027). Nothing here deploys, uses secrets, or
# calls Workers AI.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # package-lock.json is authoritative; .npmrc enforces engine-strict and
      # strict-allow-scripts (ADR-013, ADR-016).
      - name: Install dependencies
        run: npm ci

      - name: Lint, type-check, test, build
        run: npm run check
